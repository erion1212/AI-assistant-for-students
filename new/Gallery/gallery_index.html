    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Gallery</title>
    <link rel="stylesheet" href="gallery_style.css">
</head>
<body>

    <div class="header">
        <h1>Gallery</h1>
    </div>
      
    

    <section class="gallery">
        <div class="item big">
            <img src="./img/img1.jpg" alt="foto 1">
        </div>

        <div class="item">
            <img src="./img/img2.jpg" alt="foto 2">
        </div>

        <div class="item">
            <img  src="./img/img3.jpg" alt="foto 3">
        </div>

        <div class="item wide">
            <img src="./img/img4.jpg" alt="foto 4">
        </div>

        <div class="item">
            <img src="./img/img5.jpg" alt="foto 5">
        </div>

        <div class="item">
            <img src="./img/img6.jpg" alt="foto 6">
        </div>
    </section>
    
   <div id="lightbox">
    <span id="close">&times;</span>
    <a id="downloadBtn" download>⬇ Download</a>
    <img id="lightbox-img">
</div>

<script src="gallery_script.js"></script>



</body>
</html>
